[package]
name = "midori-runtime"
version = "0.1.0"
edition = "2021"
description = "CLI and pipeline orchestrator for the Midori signal bridge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mew-ton/midori"

[lib]
name = "midori_runtime"
path = "src/lib.rs"

[[bin]]
name = "midori"
path = "src/main.rs"

[dependencies]
midori-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
dirs = "5"
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
