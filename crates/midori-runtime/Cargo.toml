[package]
name = "midori-runtime"
version = "0.1.0"
edition = "2021"
description = "CLI and pipeline orchestrator for the Midori signal bridge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mew-ton/midori"

[lib]
name = "midori_runtime"
path = "src/lib.rs"

[[bin]]
name = "midori"
path = "src/main.rs"

[dependencies]
midori-core = { workspace = true }
# Inline-tier IPC primitives (RingConsumer, fd_socket, ring_handshake) live
# in their own crate so the `unsafe` blocks needed for `mmap` and SCM_RIGHTS
# stay confined there. This crate consumes only the safe surface, which is
# why `lints.workspace = true` (i.e. `unsafe_code = "forbid"`) holds here.
midori-ipc-shm = { workspace = true }
clap = { version = "4", features = ["derive"] }
# Cross-platform user-directory resolution. Chosen over `dirs` to
# avoid the MPL-2.0 `option-ext` transitive (`dirs → dirs-sys →
# option-ext`) so the workspace's license posture stays permissive
# ahead of the `midori-core` / `midori-sdk` crates.io publish track.
# `etcetera` covers the same XDG / platform data-dir surface
# (`~/Library/Application Support` on macOS, `%APPDATA%` on Windows,
# `$XDG_DATA_HOME` on Linux) under MIT OR Apache-2.0.
etcetera = "0.11"
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"

# Safe Unix syscall wrappers. Used by `driver_proc` to send `SIGTERM`
# during driver subprocess shutdown. mmap / memfd / SCM_RIGHTS-related
# nix features are owned by `midori-ipc-shm`, not this crate.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"
# Pull in the `test-helpers` feature so the in-process ring-ingest tests
# below can call `RingConsumer::test_push` to inject synthetic payloads.
# The feature gate keeps that helper out of the production build.
midori-ipc-shm = { workspace = true, features = ["test-helpers"] }

[lints]
workspace = true
