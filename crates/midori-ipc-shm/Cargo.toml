[package]
name = "midori-ipc-shm"
version = "0.1.0"
edition = "2021"
description = "Inline-tier IPC primitives (shm ring + SCM_RIGHTS fd handoff) for the Midori signal bridge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mew-ton/midori"

[features]
# `RingConsumer::test_push` (and supporting `ShmHeaderView`) を依存元の
# dev-dependencies から呼べるようにする feature。本 crate 自身のテストでは
# `cfg(test)` でも自動的に同じコードが有効化される。プロダクションコードからは
# enable しないこと（producer 側書き込み機能を露出するため）。
test-helpers = []

[dependencies]
midori-core = { workspace = true }

# Inline-tier shm ring requires `mmap`, OS-specific shm 確保 syscall
# (`memfd_create` on Linux / `shm_open` on macOS), `ftruncate`, and
# SCM_RIGHTS-bearing `sendmsg` / `recvmsg`. `mmap` (`MmapOptions::map_mut`) is
# fundamentally `unsafe` because the kernel can mutate the mapped region
# outside the compiler's aliasing model; SCM_RIGHTS reception is `unsafe`
# because received `RawFd`s have to be promoted to `OwnedFd` without the
# borrow checker's help. These are the reasons this crate downgrades
# `unsafe_code` to `deny` while the rest of the workspace stays on
# `forbid` — see the `[lints.rust]` block below.
#
# nix 0.30 note: `memfd_create` lives in `nix::sys::memfd`, which is
# `cfg(any(linux, android))`-gated rather than feature-gated. macOS / iOS
# 経路では nix::sys::mman::shm_open / shm_unlink を代わりに使う（これらは
# nix の `mman` + `fs` features で有効化される）。Windows backend は未実装。
# Linux + macOS で共通の dispatch / cfg は `src/lib.rs` と
# `src/ring_consumer/mod.rs` を参照。
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["mman", "fs", "socket", "uio"] }
# Safe(-ish) wrapper around `mmap`. The `map_mut` constructor is `unsafe`
# (see above); the returned `MmapMut` itself exposes a `&mut [u8]`-like
# interface that is otherwise pure-safe Rust.
memmap2 = "0.9"

# Windows backend.
#
# The Windows inline-tier IPC primitives need: named shared memory
# (`CreateFileMappingW` / `MapViewOfFile` / `UnmapViewOfFile`), Named Pipes
# (`CreateNamedPipeW` / `ConnectNamedPipe` / `WriteFile` / `ReadFile`),
# process handle acquisition (`OpenProcess` / `GetCurrentProcess`), and
# cross-process handle duplication (`DuplicateHandle`). Plus `CloseHandle`
# for resource cleanup.
#
# `windows-sys` is preferred over `windows`:
# - It is a thin `extern "system"` binding (no built-in safe wrappers), so
#   every call is explicitly `unsafe`. The crate-local `unsafe_code = "deny"`
#   posture (see `[lints.rust]` block below) requires SAFETY comments next
#   to each `unsafe { ... }` block, which lines up cleanly with one syscall
#   per block.
# - Smaller binary footprint than `windows` for the few APIs we actually
#   call.
# - The `windows` crate's `Owned*` types do not change the underlying call
#   semantics; for handle duplication across processes we ultimately deal
#   in raw `HANDLE` values either way.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Cross-platform safe wrapper for `pipe(2)`. Used by the SCM_RIGHTS
# round-trip test to construct a pair of file descriptors whose semantics
# are easy to observe (write to one end, read on the other) without
# needing an `unsafe` block in the test code itself.
os_pipe = "1"

# This crate intentionally does *not* set `lints.workspace = true`. The
# workspace declares `unsafe_code = "forbid"`, which would prevent the
# `unsafe` blocks required by `mmap` and SCM_RIGHTS reception from
# compiling. cargo also rejects mixing `lints.workspace = true` with
# per-crate lint overrides, so every workspace lint is re-declared below
# and only `unsafe_code` is downgraded to `deny`. Keep this list in sync
# with the root `Cargo.toml`'s `[workspace.lints]` block when it changes.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all         = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
