[package]
name = "midori-driver-midi"
version = "0.1.0"
edition = "2021"
description = "Official MIDI driver for the Midori signal bridge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mew-ton/midori"

[[bin]]
name = "midori-driver-midi"
path = "src/main.rs"

[dependencies]
midir = "0.11.0"
midori-sdk = { workspace = true }

[dev-dependencies]
midori-runtime = { path = "../midori-runtime" }
serde_yaml_ng = "0.10"

[lints]
workspace = true
