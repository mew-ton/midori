name: CI

# `pull_request: types` から `ready_for_review` を含めることで、draft → ready
# の切替時に CI が起動する。draft 状態では CI を走らせず実行時間を節約する
# (各 job に `if: github.event.pull_request.draft != true` ガードを併設)。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Read-only is sufficient for every job in this workflow: cargo / cargo-deny
# / pnpm-biome all consume the checked-out tree without writing to PRs,
# Releases, or Pages. Pinning to a minimal scope follows the GitHub
# Actions hardening guidance flagged by CodeQL `actions/missing-workflow-permissions`.
permissions:
  contents: read

# 各 job の `if:` ガードについて:
# - `push: branches: [main]` イベントでは `github.event.pull_request` 自体が
#   undefined なので `.draft` は null となり、null != true で条件成立 → job
#   は走る (main への push は draft 概念が無いため CI 必須)
# - `pull_request` イベントでは `.draft` が boolean で評価され、true の
#   ときのみ skip
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft != true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # `midori-driver-midi` pulls in `midir`, which on Linux links the
      # ALSA C library via `alsa-sys`. macOS uses CoreMIDI and Windows
      # uses WinMM, so the headers are only required on the Linux runner.
      - name: install ALSA headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
        if: matrix.os == 'ubuntu-latest'

      - name: fmt
        run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-latest'

      - name: test
        run: cargo test --workspace

      - name: check (cross-platform)
        run: cargo check --workspace

  rust-deny:
    name: Rust cargo-deny
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v6
      # cargo-deny reads only Cargo.lock plus its configuration, so one
      # Linux invocation covers every target platform of the workspace.
      # The default `check` subcommand exercises advisories, licenses,
      # bans, and sources together; the policy for each section lives
      # in `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  js:
    name: JS
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: biome check
        run: pnpm check

      - name: biome format
        run: pnpm format:check
