[package]
name = "midori-driver-dummy"
version = "0.1.0"
edition = "2021"
description = "Test fixture driver binary for the Midori signal bridge spawn / handshake suite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mew-ton/midori"
publish = false

[[bin]]
name = "midori-driver-dummy"
path = "src/main.rs"

# The fixture variants compile from the same `src/main.rs` and select their
# behavior via `env!("CARGO_BIN_NAME")` at build time. They exist as separate
# binaries so the integration test can hand spawn_driver an exact path
# instead of materialising a wrapper script — a pattern that races against
# parallel tests under Linux fork-exec semantics (ETXTBSY).

[[bin]]
name = "midori-driver-dummy-no-hello"
path = "src/main.rs"

[[bin]]
name = "midori-driver-dummy-bad-version"
path = "src/main.rs"

# Lifecycle / log-forwarding fixtures. Each variant is a separate binary
# so the integration test resolves an exact pre-built path — same rationale
# as the handshake fixtures above.

[[bin]]
name = "midori-driver-dummy-noisy-stdout"
path = "src/main.rs"

[[bin]]
name = "midori-driver-dummy-sigterm-graceful"
path = "src/main.rs"

[[bin]]
name = "midori-driver-dummy-sigterm-ignore"
path = "src/main.rs"

[[bin]]
name = "midori-driver-dummy-exit-error"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Sync signal handler used by the SIGTERM fixtures. signal-hook is already
# in the workspace lock via `midori-sdk` so no new transitive surface is
# introduced. Windows lacks POSIX signals so the dependency is unix-only;
# Windows fixtures fall back to stdin-EOF for shutdown.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[lints]
workspace = true
